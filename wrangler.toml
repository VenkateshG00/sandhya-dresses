name = "store"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static assets served from the Vite build output
assets = { directory = "./dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[[d1_databases]]
binding = "DB"
database_name = "sandhya-dresses-db"
database_id = "f9150dda-3076-4b93-908b-d1365cf84768"
migrations_dir = "migrations"

# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "sandhya-dresses-images"
# Uncomment after: enabling R2 in Cloudflare dashboard + npx wrangler r2 bucket create sandhya-dresses-images

# Secrets — set via: wrangler secret put SECRET_NAME
# RAZORPAY_KEY_ID
# RAZORPAY_KEY_SECRET
# ADMIN_PASSWORD_HASH     (bcrypt hash of your chosen admin password)
# SESSION_SECRET          (random 64-char string for signing session tokens)

[vars]
ENVIRONMENT = "production"
SITE_URL = "https://store.sandhyadresses.workers.dev"

[env.preview]
name = "sandhya-dresses-preview"
vars = { ENVIRONMENT = "preview", SITE_URL = "https://sandhya-dresses-preview.workers.dev" }

[[env.preview.d1_databases]]
binding = "DB"
database_name = "sandhya-dresses-db"
database_id = "f9150dda-3076-4b93-908b-d1365cf84768"
migrations_dir = "migrations"

# [[env.preview.r2_buckets]]
# binding = "IMAGES"
# bucket_name = "sandhya-dresses-images-preview"
